<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leer Afrikaans">
<meta name="theme-color" content="#2F6B4F">
<title>Leer Afrikaans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F2;--surface:#FFFFFF;--ink:#1C2540;--muted:#5F6785;--line:#DADFE8;
  --brand:#2F6B4F;--brand-soft:#DCEBE3;--accent:#D93A74;--sun:#F0A92E;--good:#2F7D4F;--good-bg:#DDF0E4;--bad:#B8383B;--bad-bg:#F8E0E0;--on-brand:#fff;
  --display:'Fraunces',Georgia,'Times New Roman',serif;--body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#111729;--surface:#1B2440;--ink:#EEF1F8;--muted:#A2ABC8;--line:#2C3658;--brand:#5BB887;--brand-soft:#1F3A33;--accent:#F06A98;--good:#6CCB92;--good-bg:#1B3A2E;--bad:#F08A8C;--bad-bg:#432326;--on-brand:#0E1A15}
}
:root[data-theme="dark"]{--bg:#111729;--surface:#1B2440;--ink:#EEF1F8;--muted:#A2ABC8;--line:#2C3658;--brand:#5BB887;--brand-soft:#1F3A33;--accent:#F06A98;--good:#6CCB92;--good-bg:#1B3A2E;--bad:#F08A8C;--bad-bg:#432326;--on-brand:#0E1A15}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{max-width:520px;margin:0 auto;padding:16px 18px 110px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;font-weight:800}
h2{font-size:1.5rem;margin:26px 0 4px}
h3{font-size:1.1rem}
p{margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.pills{display:flex;gap:8px}
.pill{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.92rem}
.primary{display:block;width:100%;background:var(--brand);color:#fff;font-weight:800;padding:15px 18px;border-radius:14px;text-align:center;font-size:1.05rem}
:root[data-theme="dark"] .primary,.dark-primary{color:#0E1A15}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#0E1A15}}
.secondary{display:block;width:100%;border:2px solid var(--line);background:var(--surface);font-weight:800;padding:13px 18px;border-radius:14px;text-align:center}
.ghost{color:var(--muted);font-weight:800;padding:8px 4px}
.next{background:var(--brand);color:#fff;border-radius:20px;padding:20px 20px 18px;margin:4px 0 6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{color:#0E1A15}}
:root[data-theme="dark"] .next{color:#0E1A15}
.next h1{font-size:2rem}
.next .btn{margin-top:14px;background:#fff;color:#1C2540;font-weight:800;padding:12px 18px;border-radius:12px;display:inline-block}
.welcome input{width:100%;font:inherit;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);margin:10px 0}
.lvl{margin-top:26px}
.lvl-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.path{list-style:none;margin:12px 0 0;padding:0 0 0 22px;position:relative}
.path::before{content:"";position:absolute;left:21px;top:20px;bottom:20px;width:3px;background:var(--line);border-radius:3px}
.path li{position:relative}
.lrow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:9px 0}
.node{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;background:var(--surface);border:3px solid var(--line);position:relative;z-index:1;margin-left:-22px}
.node.done{background:var(--brand-soft);border-color:var(--brand)}
.node.up{background:var(--accent);border-color:var(--accent)}
.lt{font-weight:800}
.ls{font-size:.85rem;color:var(--muted)}
.star{color:var(--sun);letter-spacing:1px}
.test{margin:8px 0 0 22px;display:block;font-weight:800;color:var(--brand);padding:6px 0}
.reviewbox{border:2px dashed var(--line);border-radius:16px;padding:14px 16px;margin-top:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs div{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1;padding:11px 0 10px;font-weight:800;font-size:.82rem;color:var(--muted)}
nav.tabs button span{display:block;font-size:1.35rem;line-height:1.2}
nav.tabs button.on{color:var(--brand)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .3s}
.qtop{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.qtop .bar{flex:1}
.label{color:var(--muted);font-weight:800;margin-bottom:8px}
.prompt{font-family:var(--display);font-size:2.3rem;font-weight:800;line-height:1.1;margin:6px 0 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prompt.en{font-size:1.9rem}
.spk{flex:none;width:48px;height:48px;border-radius:50%;background:var(--brand-soft);font-size:1.2rem;display:inline-grid;place-items:center}
.spk.slow{width:40px;height:40px;font-size:1rem}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.tin{width:100%;font:inherit;font-size:1.2rem;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.chars{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.chars button{min-width:40px;padding:8px 0;border-radius:10px;background:var(--surface);border:2px solid var(--line);font-weight:800}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .opt{text-align:center;padding:14px 8px;font-size:.98rem}
.mt .opt.sel{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px var(--accent) inset}
.mt .opt.gone{opacity:.35;border-color:var(--good)}
.mt .opt.shake{border-color:var(--bad);background:var(--bad-bg)}
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));z-index:6}
.fb>div{max-width:520px;margin:0 auto}
.fb.good{background:var(--good-bg)}.fb.bad{background:var(--bad-bg)}
.fb strong{font-family:var(--display);font-size:1.25rem;display:block}
.fb p{margin:2px 0 12px}
.micbtn{width:84px;height:84px;border-radius:50%;background:var(--accent);color:#fff;font-size:2rem;display:grid;place-items:center;margin:8px auto 4px}
.micbtn.live{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.micbtn.live{animation:none}.bar i{transition:none}}
.card{background:var(--brand);color:#fff;border-radius:22px;padding:34px 22px;text-align:center;margin:8px 0 18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{color:#0E1A15}}
:root[data-theme="dark"] .card{color:#0E1A15}
.card .af{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.card .en{font-size:1.15rem;margin-top:10px;opacity:.92}
.card .spk{background:rgba(255,255,255,.9);color:#1C2540;margin:18px 6px 0}
.tips{list-style:none;padding:0;margin:14px 0 22px}
.tips li{padding:12px 0 12px 16px;border-left:4px solid var(--accent);margin-bottom:12px;background:var(--surface);border-radius:0 12px 12px 0;padding-right:14px}
.big{font-family:var(--display);font-size:3.4rem;font-weight:800;line-height:1}
.hero{text-align:center;padding:24px 0 10px}
.stars{font-size:2.4rem;color:var(--sun);letter-spacing:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.stat{border-top:3px solid var(--line);padding-top:8px}
.stat b{font-family:var(--display);font-size:1.7rem;display:block}
.wl{list-style:none;padding:0;margin:8px 0}
.wl li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.dots{letter-spacing:2px;color:var(--brand)}
.set label{display:block;font-weight:800;margin:14px 0 4px}
.set input,.set select{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.set .secondary,.set .primary{margin-top:10px}
.note{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.warn{border-color:var(--sun)}

.pic{font-size:5rem;line-height:1.1;text-align:center;margin:6px 0 22px}
.picopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picopts .opt{font-size:2.8rem;text-align:center;padding:10px;line-height:1.2}
.slots{min-height:62px;border-bottom:3px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 10px;margin-bottom:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tile{padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 var(--line)}
.tile.used{opacity:.22;box-shadow:none}
.tile.ok{border-color:var(--good);background:var(--good-bg)}
.tile.no{border-color:var(--bad);background:var(--bad-bg)}
.blank{display:inline-block;border-bottom:4px solid var(--accent);color:transparent;margin:0 2px}
.blank.rev{color:var(--ink);border-color:var(--good)}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mem.four{grid-template-columns:repeat(4,1fr)}
.mcard{aspect-ratio:1/1.05;border-radius:14px;background:var(--brand);color:var(--on-brand);font-weight:800;font-size:1rem;display:grid;place-items:center;padding:4px;text-align:center;overflow-wrap:anywhere;border:2px solid var(--brand)}
.mcard.up{background:var(--surface);color:var(--ink);border-color:var(--accent)}
.mcard.done{background:var(--good-bg);color:var(--ink);border-color:var(--good);opacity:.7}
.mcard .e{font-size:2rem}
.gm{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line)}
.gm .node{margin-left:0}
.fbspace{height:130px}
details.ub{margin-top:6px}
summary.unit{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding:8px 0;border-bottom:2px solid var(--line);font-weight:800;color:var(--brand)}
summary.unit::-webkit-details-marker{display:none}
summary.unit .muted{font-weight:700}
.daily{border-radius:18px;padding:14px 16px;margin-top:14px;background:var(--surface);border:2px solid var(--accent)}
.daily.done{border-color:var(--good);background:var(--good-bg)}
</style>
</head>

 {"id": "greetings", "level": "beginner", "title": "Greetings", "emoji": "👋", "tips": ["Afrikaans is spelled much like it sounds, once you learn a few letters.", "The letter g is a throaty sound, like the ch in Scottish loch. It is in goeie (roughly KHOO-yuh).", "Môre has a little hat on the o. It just makes the vowel longer.", "Add baie (very) to make thanks bigger: baie dankie."], "items": [["Hallo", "Hello"], ["Goeie môre", "Good morning"], ["Goeie middag", "Good afternoon"], ["Goeie naand", "Good evening"], ["Totsiens", "Goodbye"], ["Dankie", "Thank you"], ["Baie dankie", "Thank you very much"], ["Asseblief", "Please"], ["Ja", "Yes"], ["Nee", "No"], ["Hoe gaan dit?", "How are you?"], ["Dit gaan goed, dankie", "I'm well, thank you"]], "unit": "Saying hello"},

 {"id": "wild", "level": "beginner", "title": "Wild animals", "emoji": "🦁", "tips": ["South Africa is famous for safaris, so these words are very useful.", "Seekoei literally means sea-cow. That is the Afrikaans word for hippo.", "Kameelperd is camel + horse, an old name for the giraffe."], "items": [["leeu", "lion"], ["olifant", "elephant"], ["seekoei", "hippo"], ["kameelperd", "giraffe"], ["sebra", "zebra"], ["bobbejaan", "baboon"], ["krokodil", "crocodile"], ["volstruis", "ostrich"], ["luiperd", "leopard"], ["renoster", "rhino"], ["Die olifant is baie groot", "The elephant is very big"], ["Die leeu slaap", "The lion is sleeping"]], "unit": "Animals"},

 {"id": "body", "level": "beginner", "title": "The body", "emoji": "🧍", "tips": ["Some nouns have special plurals: oog becomes oë (eyes) and hand becomes hande.", "Seer means sore or painful. My voet is seer means My foot is sore.", "The ie in hartseer and the ee sound are close to English ee."], "items": [["kop", "head"], ["oog", "eye"], ["oor", "ear"], ["neus", "nose"], ["mond", "mouth"], ["hand", "hand"], ["arm", "arm"], ["been", "leg"], ["voet", "foot"], ["hart", "heart"], ["My voet is seer", "My foot is sore"], ["Maak jou oë toe", "Close your eyes"]], "unit": "Home and body"},
 {"id": "adjectives", "level": "beginner", "title": "Describing things", "emoji": "📏", "tips": ["Adjectives usually go before the noun, like in English: 'n groot huis, a big house.", "Many adjectives add an -e before a noun, like nuut becoming nuwe. You don't need to master this yet, just notice it.", "Baie (very) and te (too) go before the adjective."], "items": [["groot", "big"], ["klein", "small"], ["oud", "old"], ["nuut", "new"], ["mooi", "pretty / beautiful"], ["lelik", "ugly"], ["vinnig", "fast"], ["stadig", "slow"], ["lank", "long / tall"], ["kort", "short"], ["goed", "good"], ["sleg", "bad"], ["Die huis is groot", "The house is big"], ["Dit is 'n nuwe motor", "It is a new car"]], "unit": "Home and body"},
 {"id": "beinghave", "level": "beginner", "title": "To be and to have", "emoji": "🔁", "tips": ["Is means am, is and are. It never changes: ek is, jy is, ons is.", "Het means have and has. It never changes either: ek het, jy het, sy het.", "To say you are not something, add nie at the end: Ek is nie moeg nie."], "items": [["tuis", "at home"], ["Ek is 'n student", "I am a student"], ["Sy is mooi", "She is pretty"], ["Hy is groot", "He is big"], ["Ons is gelukkig", "We are happy"], ["Julle is laat", "You are late"], ["Hulle is tuis", "They are at home"], ["Ek het 'n hond", "I have a dog"], ["Jy het 'n boek", "You have a book"], ["Sy het 'n kat", "She has a cat"], ["Ons het tyd", "We have time"], ["Hulle het geld", "They have money"], ["Het jy 'n pen?", "Do you have a pen?"]], "unit": "Building sentences"},
 {"id": "littlewords", "level": "beginner", "title": "Handy little words", "emoji": "💬", "tips": ["Baie works as both very and a lot: baie goed, baie koffie.", "Nog can mean still or more, depending on the sentence.", "Niks means nothing and is a handy answer when someone asks Wat is dit?"], "items": [["hier", "here"], ["daar", "there"], ["nou", "now"], ["baie", "very / a lot"], ["bietjie", "a little"], ["nog", "still / more"], ["almal", "everyone"], ["niks", "nothing"], ["iets", "something"], ["Ek is hier", "I am here"], ["Hy is daar", "He is there"], ["Nog 'n koffie, asseblief", "Another coffee, please"], ["Ek het niks", "I have nothing"]], "unit": "Building sentences"},
 {"id": "family", "level": "elementary", "title": "Family", "emoji": "👨‍👩‍👧", "tips": ["Possessives are simple: my (my), jou (your), sy (his), haar (her), ons (our).", "Ma and pa are used just like mom and dad.", "Ek het means I have. It is also used later for the past tense."], "items": [["ma", "mom"], ["pa", "dad"], ["broer", "brother"], ["suster", "sister"], ["oupa", "grandfather"], ["ouma", "grandmother"], ["seun", "son"], ["dogter", "daughter"], ["man", "husband / man"], ["vrou", "wife / woman"], ["kind", "child"], ["vriend", "friend"], ["Dit is my ma", "This is my mom"], ["Ek het 'n broer", "I have a brother"], ["Sy het twee susters", "She has two sisters"]], "unit": "People and time"},
 {"id": "extfamily", "level": "elementary", "title": "Extended family", "emoji": "👪", "tips": ["Oom and tannie are also polite ways to address older men and women, even if they are not related to you.", "Se works like 's in English: ma se suster is mom's sister.", "Woon means live, as in where you reside."], "items": [["oom", "uncle"], ["tannie", "aunt"], ["neef", "male cousin / nephew"], ["niggie", "female cousin / niece"], ["skoonma", "mother-in-law"], ["skoonpa", "father-in-law"], ["ouers", "parents"], ["gesin", "family / household"], ["kleinkind", "grandchild"], ["My oom woon in Pretoria", "My uncle lives in Pretoria"], ["Ons het 'n groot gesin", "We have a big family"], ["Tannie Sarie is my ma se suster", "Aunt Sarie is my mom's sister"]], "unit": "People and time"},
 {"id": "days", "level": "elementary", "title": "Days and time", "emoji": "📅", "tips": ["Days of the week start with a capital letter in Afrikaans.", "Dag means day, and every weekday ends in -dag except Vrydag and Saterdag.", "Hoe laat is dit? literally means How late is it? and is the normal way to ask the time."], "items": [["Maandag", "Monday"], ["Dinsdag", "Tuesday"], ["Woensdag", "Wednesday"], ["Donderdag", "Thursday"], ["Vrydag", "Friday"], ["Saterdag", "Saturday"], ["Sondag", "Sunday"], ["vandag", "today"], ["môre", "tomorrow"], ["gister", "yesterday"], ["Tot môre", "See you tomorrow"], ["Hoe laat is dit?", "What time is it?"], ["Dit is drie uur", "It is three o'clock"]], "unit": "People and time"},
 {"id": "months", "level": "elementary", "title": "Months and birthdays", "emoji": "🎂", "tips": ["Months are capitalised and look a lot like English.", "Dates go day, month, year: 5 Oktober 2026.", "Gelukkige verjaardag is Happy birthday."], "items": [["Januarie", "January"], ["Februarie", "February"], ["Maart", "March"], ["April", "April"], ["Mei", "May"], ["Junie", "June"], ["Julie", "July"], ["Augustus", "August"], ["September", "September"], ["Oktober", "October"], ["November", "November"], ["Desember", "December"], ["Wanneer is jou verjaardag?", "When is your birthday?"], ["My verjaardag is in Maart", "My birthday is in March"], ["Gelukkige verjaardag", "Happy birthday"]], "unit": "People and time"},
 {"id": "clock", "level": "elementary", "title": "Telling the time", "emoji": "🕐", "tips": ["Oor means past and voor means to: vyf oor nege is five past nine.", "Careful with half: half vyf means half past FOUR, thirty minutes into the hour before five.", "Uur means both hour and o'clock: dit is twee uur."], "items": [["uur", "hour / o'clock"], ["minuut", "minute"], ["oggend", "morning"], ["middag", "afternoon / midday"], ["aand", "evening"], ["nag", "night"], ["Dit is vyf oor nege", "It is five past nine"], ["Dit is tien voor ses", "It is ten to six"], ["Dit is kwart oor drie", "It is quarter past three"], ["Dit is kwart voor vier", "It is quarter to four"], ["Dit is half vyf", "It is half past four"], ["Om watter tyd begin dit?", "At what time does it start?"]], "unit": "People and time"},
 {"id": "bignumbers", "level": "elementary", "title": "Bigger numbers", "emoji": "💯", "tips": ["Teens end in -tien: dertien, veertien. Tens end in -tig: twintig, dertig.", "In the middle numbers the ones come first: eenentwintig is one-and-twenty (21).", "Jaar oud is years old: Ek is dertig jaar oud."], "items": [["Elf", "Eleven (11)"], ["Twaalf", "Twelve (12)"], ["Dertien", "Thirteen (13)"], ["Veertien", "Fourteen (14)"], ["Vyftien", "Fifteen (15)"], ["Twintig", "Twenty (20)"], ["Eenentwintig", "Twenty-one (21)"], ["Dertig", "Thirty (30)"], ["Veertig", "Forty (40)"], ["Vyftig", "Fifty (50)"], ["Honderd", "One hundred (100)"], ["Duisend", "One thousand (1000)"], ["Ek is dertig jaar oud", "I am thirty years old"], ["Dit kos honderd rand", "It costs one hundred rand"]], "unit": "People and time"},
 {"id": "town", "level": "elementary", "title": "Getting around", "emoji": "🧭", "tips": ["Question words come first: Waar is... ? means Where is... ?", "Hoeveel kos dit? is your shopping survival phrase.", "Kan jy my help? is a polite way to ask for help."], "items": [["links", "left"], ["regs", "right"], ["reguit", "straight ahead"], ["winkel", "shop"], ["straat", "street"], ["stasie", "station"], ["Waar is die toilet?", "Where is the toilet?"], ["Hoeveel kos dit?", "How much does it cost?"], ["Ek is verlore", "I am lost"], ["Kan jy my help?", "Can you help me?"], ["Is dit ver?", "Is it far?"], ["Dit is naby", "It is nearby"]], "unit": "Out and about"},
 {"id": "places", "level": "elementary", "title": "Places in town", "emoji": "🏦", "tips": ["Toe after a place shows direction: stad toe means to the city, huis toe means homewards.", "Draai means turn: draai links, draai regs.", "Dorp is a town and stad is a city. Kaapstad is Cape + city."], "items": [["bank", "bank"], ["poskantoor", "post office"], ["kerk", "church"], ["biblioteek", "library"], ["park", "park"], ["dorp", "town"], ["stad", "city"], ["pad", "road"], ["brug", "bridge"], ["Die bank is naby", "The bank is nearby"], ["Ek gaan stad toe", "I am going to the city"], ["Draai links", "Turn left"], ["Gaan reguit", "Go straight"]], "unit": "Out and about"},
 {"id": "transport", "level": "elementary", "title": "Getting around town", "emoji": "🚌", "tips": ["Motor means car. Many Afrikaans transport words are easy to remember: bus, trein, fiets.", "Laat means late. Die trein is laat is a phrase you will hear a lot.", "Kaartjie is a small kaart (card), so a ticket."], "items": [["bus", "bus"], ["trein", "train"], ["motor", "car"], ["vliegtuig", "plane"], ["fiets", "bicycle"], ["lughawe", "airport"], ["kaartjie", "ticket"], ["bushalte", "bus stop"], ["Waar is die bushalte?", "Where is the bus stop?"], ["Een kaartjie, asseblief", "One ticket, please"], ["Die trein is laat", "The train is late"]], "unit": "Out and about"},
 {"id": "shopping", "level": "elementary", "title": "Shopping and money", "emoji": "💰", "tips": ["South Africa's currency is the rand. Vyftig rand is fifty rand.", "Duur (expensive) and goedkoop (cheap) are opposites you will use all the time.", "Ek wil... is a polite, direct way to say what you want."], "items": [["geld", "money"], ["prys", "price"], ["duur", "expensive"], ["goedkoop", "cheap"], ["koop", "buy"], ["betaal", "pay"], ["kontant", "cash"], ["kaart", "card"], ["Vyftig rand", "Fifty rand"], ["Dit is te duur", "It is too expensive"], ["Ek wil dit koop", "I want to buy it"], ["Kan ek met 'n kaart betaal?", "Can I pay with a card?"], ["Het jy kleingeld?", "Do you have change?"]], "unit": "Out and about"},
 {"id": "verbs", "level": "elementary", "title": "Everyday actions", "emoji": "🏃", "tips": ["Verbs never change with the person: ek eet, jy eet, hy eet, ons eet.", "Word order is like English for simple sentences: Ek eet brood (I eat bread).", "Leer means both learn and teach, so context helps."], "items": [["eet", "eat"], ["drink", "drink"], ["loop", "walk"], ["praat", "speak"], ["slaap", "sleep"], ["werk", "work"], ["lees", "read"], ["skryf", "write"], ["leer", "learn"], ["kyk", "look / watch"], ["Ek eet brood", "I eat bread"], ["Hy drink water", "He drinks water"], ["Sy lees 'n boek", "She reads a book"], ["Ek leer Afrikaans", "I am learning Afrikaans"]], "unit": "Eating and doing"},
 {"id": "restaurant", "level": "elementary", "title": "At a restaurant", "emoji": "🍽️", "tips": ["Heerlik means delicious and is a step up from lekker.", "Ek wil graag... (I would like...) is a polite way to order.", "Bord, glas, mes, vurk and lepel are the basic table items."], "items": [["spyskaart", "menu"], ["kelner", "waiter"], ["rekening", "bill"], ["bord", "plate"], ["glas", "glass"], ["mes", "knife"], ["vurk", "fork"], ["lepel", "spoon"], ["'n Tafel vir twee, asseblief", "A table for two, please"], ["Ek wil graag bestel", "I would like to order"], ["Die rekening, asseblief", "The bill, please"], ["Dit was heerlik", "It was delicious"]], "unit": "Eating and doing"},
 {"id": "kitchen", "level": "elementary", "title": "In the kitchen", "emoji": "🍳", "tips": ["Kook means both to cook and to boil.", "Vol means full and leeg means empty: die koppie is leeg.", "Endings like -pie and -ie make things small and cute. You will meet them properly in the Advanced tier."], "items": [["yskas", "fridge"], ["stoof", "stove"], ["oond", "oven"], ["pot", "pot"], ["koppie", "cup"], ["kraan", "tap"], ["skottel", "dish"], ["vol", "full"], ["leeg", "empty"], ["Ek kook aandete", "I am cooking dinner"], ["Die yskas is vol", "The fridge is full"], ["Maak die kraan toe", "Close the tap"], ["Die water kook", "The water is boiling"]], "unit": "Eating and doing"},
 {"id": "frequency", "level": "elementary", "title": "How often?", "emoji": "🔄", "tips": ["Frequency words usually come right after the verb: Ek drink altyd koffie.", "Nooit means never and does not need nie: Ek eet nooit vleis.", "Elke dag is every day, and elke week is every week."], "items": [["altyd", "always"], ["gewoonlik", "usually"], ["dikwels", "often"], ["soms", "sometimes"], ["selde", "rarely"], ["nooit", "never"], ["elke dag", "every day"], ["Ek drink altyd koffie", "I always drink coffee"], ["Ek eet nooit vleis", "I never eat meat"], ["Hy kom soms laat", "He sometimes comes late"], ["Sy loop elke dag", "She walks every day"]], "unit": "Eating and doing"},
 {"id": "work", "level": "elementary", "title": "Work and school", "emoji": "💼", "tips": ["Werk is both a verb (to work) and a noun (work).", "The ending -er often marks a person, as in onderwyser (teacher).", "Waar werk jy? is a natural small-talk question."], "items": [["skool", "school"], ["kantoor", "office"], ["onderwyser", "teacher"], ["leerder", "pupil"], ["baas", "boss"], ["vergadering", "meeting"], ["rekenaar", "computer"], ["boek", "book"], ["Waar werk jy?", "Where do you work?"], ["Ek werk in 'n kantoor", "I work in an office"], ["Ek is 'n onderwyser", "I am a teacher"]], "unit": "Work and play"},
 {"id": "hobbies", "level": "elementary", "title": "Hobbies and sport", "emoji": "⚽", "tips": ["Rugby and krieket are huge in South Africa, so you will hear these words everywhere.", "Speel means play, for games and music alike: speel sokker, speel kitaar.", "Stokperdjie comes from stokperd, a hobby-horse, and is the Afrikaans word for hobby."], "items": [["sokker", "soccer"], ["rugby", "rugby"], ["krieket", "cricket"], ["swem", "swim"], ["hardloop", "run"], ["fliek", "movie"], ["musiek", "music"], ["dans", "dance"], ["speel", "play"], ["Ek speel sokker", "I play soccer"], ["Ek hou van rugby", "I like rugby"], ["Hy swem elke dag", "He swims every day"], ["Wat is jou stokperdjie?", "What is your hobby?"], ["Ons kyk 'n fliek", "We are watching a movie"]], "unit": "Work and play"},
 {"id": "clothes", "level": "elementary", "title": "Clothes", "emoji": "👕", "tips": ["Dra means both to wear and to carry. Context tells you which.", "Te means too: te klein is too small.", "Sokkies is the word for socks and is plural by nature."], "items": [["hemp", "shirt"], ["broek", "trousers"], ["rok", "dress"], ["skoene", "shoes"], ["sokkies", "socks"], ["hoed", "hat"], ["baadjie", "jacket"], ["trui", "sweater"], ["Ek dra 'n blou hemp", "I am wearing a blue shirt"], ["Die skoene is nuut", "The shoes are new"], ["Dit is te klein", "It is too small"]], "unit": "Work and play"},
 {"id": "phone", "level": "elementary", "title": "Phones and messages", "emoji": "📱", "tips": ["Selfoon (cell phone) is the everyday word in South Africa.", "Bel means to call by phone. It comes from the sound of a bell.", "Later means later and looks just like the English word."], "items": [["foon", "phone"], ["selfoon", "cell phone"], ["boodskap", "message"], ["e-pos", "email"], ["nommer", "number"], ["bel", "call"], ["Wat is jou nommer?", "What is your number?"], ["Bel my asseblief", "Please call me"], ["Ek sal jou later bel", "I will call you later"], ["Die foon lui", "The phone is ringing"], ["Stuur vir my 'n boodskap", "Send me a message"], ["Hallo, wie praat?", "Hello, who is speaking?"]], "unit": "Work and play"},
 {"id": "people", "level": "elementary", "title": "Describing people", "emoji": "🙂", "tips": ["Baie before an adjective works like very: baie slim, very smart.", "En joins two descriptions: lank en sterk, tall and strong.", "Lief means dear or sweet. It also appears in Ek is lief vir jou (I love you)."], "items": [["jonk", "young"], ["slim", "smart"], ["vriendelik", "friendly"], ["vrolik", "cheerful"], ["sterk", "strong"], ["swak", "weak"], ["snaaks", "funny"], ["lief", "dear / sweet"], ["Sy is baie vriendelik", "She is very friendly"], ["Hy is lank en sterk", "He is tall and strong"], ["My ouma is oud maar baie slim", "My grandmother is old but very smart"], ["Hy is snaaks", "He is funny"]], "unit": "Work and play"},
 {"id": "story1", "level": "elementary", "title": "Reading: Anna's day", "emoji": "📖", "tips": ["This lesson is a short story. Read each sentence, listen to it, and then build it yourself.", "Daarna means afterwards and dan means then.", "Saans means in the evenings, and elke oggend means every morning."], "items": [["Anna woon in 'n klein dorpie", "Anna lives in a small town"], ["Sy het 'n hond met die naam Rex", "She has a dog named Rex"], ["Elke oggend loop hulle by die rivier", "Every morning they walk by the river"], ["Rex hou van die water", "Rex likes the water"], ["Daarna gaan Anna werk toe", "Afterwards Anna goes to work"], ["Sy werk in 'n boekwinkel", "She works in a bookshop"], ["Om vyf uur gaan sy huis toe", "At five o'clock she goes home"], ["Saans maak sy aandete", "In the evenings she makes dinner"], ["Dan lees sy 'n boek", "Then she reads a book"], ["Anna is baie gelukkig", "Anna is very happy"]], "unit": "Reading practice"},
 {"id": "story2", "level": "elementary", "title": "Reading: Market day", "emoji": "🧺", "tips": ["Mark is market. Daar is means there is or there are.", "Vars means fresh.", "Roomys is cream-ice, the word for ice cream."], "items": [["Ons gaan Saterdag na die mark", "We go to the market on Saturday"], ["Daar is baie mense", "There are many people"], ["Ek koop vars groente en vrugte", "I buy fresh vegetables and fruit"], ["Die piesange is goedkoop", "The bananas are cheap"], ["Ma soek 'n mooi blou rok", "Mom is looking for a pretty blue dress"], ["Pa koop 'n koppie koffie", "Dad buys a cup of coffee"], ["'n Man speel musiek", "A man is playing music"], ["Die kinders eet roomys", "The children eat ice cream"], ["Dit was 'n lekker dag", "It was a nice day"]], "unit": "Reading practice"},
 {"id": "weather", "level": "intermediate", "title": "Weather and seasons", "emoji": "☀️", "tips": ["Dit is used for it, as in Dit reën (It rains).", "The ee in reën is a long vowel, and the two dots just tell you to say the vowels separately.", "South Africa's seasons are flipped from the northern hemisphere: December is summer."], "items": [["son", "sun"], ["reën", "rain"], ["wind", "wind"], ["wolk", "cloud"], ["warm", "warm"], ["koud", "cold"], ["somer", "summer"], ["winter", "winter"], ["Dit reën", "It is raining"], ["Die son skyn", "The sun is shining"], ["Dit is warm vandag", "It is warm today"], ["Dit is baie koud", "It is very cold"]], "unit": "Weather and feelings"},
 {"id": "feelings", "level": "intermediate", "title": "Feelings and opinions", "emoji": "😊", "tips": ["Baie (very) goes before the word: baie bly, very happy.", "Hoe voel jy? is how you ask how someone feels, not just how they are.", "Ek hou van... is I like... and the thing you like comes after it."], "items": [["bly", "happy"], ["hartseer", "sad"], ["moeg", "tired"], ["bang", "scared"], ["kwaad", "angry"], ["siek", "sick"], ["Hoe voel jy?", "How do you feel?"], ["Ek is moeg", "I am tired"], ["Ek is baie bly", "I am very happy"], ["Ek is bly om jou te sien", "I am glad to see you"], ["Ek hou van koffie", "I like coffee"]], "unit": "Weather and feelings"},
 {"id": "smalltalk", "level": "intermediate", "title": "Small talk and wishes", "emoji": "🥂", "tips": ["Sterkte (literally strength) is what you say to someone facing something hard, like an exam.", "Beterskap is the way to wish someone a speedy recovery.", "Naweek (weekend) is na (after) plus week."], "items": [["Hoe was jou dag?", "How was your day?"], ["My dag was goed", "My day was good"], ["Wat het jy gedoen?", "What did you do?"], ["Niks spesiaals nie", "Nothing special"], ["Lekker naweek!", "Have a good weekend!"], ["Geluk!", "Congratulations!"], ["Beterskap!", "Get well soon!"], ["Sterkte!", "Good luck! / Be strong!"], ["Groete aan jou familie", "Greetings to your family"], ["Lekker dag verder", "Have a nice rest of your day"]], "unit": "Weather and feelings"},
 {"id": "nature", "level": "intermediate", "title": "Nature and the sky", "emoji": "🌳", "tips": ["Plurals often add -e or -s: ster becomes sterre, blom becomes blomme.", "Skyn means shine and is used for both the sun and the moon.", "Wêreld has a circumflex: the ê sounds like the e in bed, but longer."], "items": [["boom", "tree"], ["blom", "flower"], ["rivier", "river"], ["woud", "forest"], ["klip", "stone"], ["maan", "moon"], ["ster", "star"], ["lug", "sky / air"], ["wêreld", "world"], ["diep", "deep"], ["Die maan skyn", "The moon is shining"], ["Die rivier is diep", "The river is deep"], ["Daar is baie sterre aan die lug", "There are many stars in the sky"]], "unit": "Weather and feelings"},
 {"id": "past", "level": "intermediate", "title": "The past tense", "emoji": "⏪", "tips": ["The past is easy: use het plus the verb with ge- in front. Ek het gewerk, I worked.", "Sometimes ge- goes before the verb stem: leer becomes geleer, kyk becomes gekyk.", "Eet is a special one: ek het geëet, I ate."], "items": [["Ek het gewerk", "I worked"], ["Ek het koffie gedrink", "I drank coffee"], ["Sy het brood geëet", "She ate bread"], ["Ons het gepraat", "We talked"], ["Hy het baie geslaap", "He slept a lot"], ["Ek het jou gesien", "I saw you"], ["Het jy geëet?", "Did you eat?"], ["Ek het gister gewerk", "I worked yesterday"], ["Ek het Afrikaans geleer", "I learned Afrikaans"], ["Hulle het gekyk", "They watched"], ["gisteraand", "last night"]], "unit": "Grammar toolkit"},
 {"id": "irregpast", "level": "intermediate", "title": "More past tense", "emoji": "⏮️", "tips": ["Some past forms are not just ge- plus the verb: gaan becomes gegaan and sê becomes gesê.", "Ek was means I was, as in Ek was by die huis.", "Ek het gehad means I had."], "items": [["Ek was by die huis", "I was at home"], ["Ek het 'n hond gehad", "I had a dog"], ["Ek het gister Kaapstad toe gegaan", "I went to Cape Town yesterday"], ["Hy het gister gekom", "He came yesterday"], ["Hy het niks gesê", "He said nothing"], ["Ek het dit geweet", "I knew it"], ["Ons het brood gekoop", "We bought bread"], ["Ek het lank gewag", "I waited a long time"], ["Ek het jou gebel", "I called you"], ["Hulle het laat aangekom", "They arrived late"], ["Wat het jy gesê?", "What did you say?"]], "unit": "Grammar toolkit"},
 {"id": "questions", "level": "intermediate", "title": "Questions and no", "emoji": "❓", "tips": ["Afrikaans has a famous double nie: Ek is nie honger nie. The second nie goes at the end of the sentence.", "With a simple verb, one nie at the end is enough: Ek weet nie.", "Hoekom is why, and wanneer is when."], "items": [["Wie?", "Who?"], ["Wat?", "What?"], ["Waar?", "Where?"], ["Wanneer?", "When?"], ["Hoekom?", "Why?"], ["Hoe?", "How?"], ["Hoeveel?", "How much / how many?"], ["Ek weet nie", "I don't know"], ["Ek is nie honger nie", "I am not hungry"], ["Ek het nie tyd nie", "I don't have time"], ["Ek hou nie van reën nie", "I don't like rain"], ["Wat doen jy?", "What are you doing?"]], "unit": "Grammar toolkit"},
 {"id": "modals", "level": "intermediate", "title": "Can, must, want, will", "emoji": "💪", "tips": ["Kan (can), moet (must), wil (want to) and sal (will) are followed by a plain verb: Ek kan swem.", "Ons gaan + verb means we are going to do something: Ons gaan braai.", "With a modal verb the negative nie often comes at the end: Ek kan nie kom nie."], "items": [["kan", "can"], ["moet", "must / have to"], ["wil", "want to"], ["sal", "will"], ["Ek kan swem", "I can swim"], ["Ek moet werk", "I must work"], ["Ek wil slaap", "I want to sleep"], ["Ek sal môre kom", "I will come tomorrow"], ["Ons gaan Sondag braai", "We are going to braai on Sunday"], ["Ek kan nie kom nie", "I can't come"], ["Ek wil nie gaan nie", "I don't want to go"], ["Sal jy my asseblief help?", "Will you please help me?"]], "unit": "Grammar toolkit"},
 {"id": "connectors", "level": "intermediate", "title": "Joining ideas", "emoji": "🔗", "tips": ["Want and omdat both mean because, but they work differently.", "After want the word order stays normal: Ek is moeg, want ek het gewerk.", "After omdat the verb jumps to the end: Ek bly tuis omdat dit reën."], "items": [["en", "and"], ["maar", "but"], ["of", "or"], ["want", "because"], ["omdat", "because"], ["ook", "also / too"], ["as", "if / when"], ["Tee of koffie?", "Tea or coffee?"], ["Ek hou van koffie, maar ek hou meer van tee", "I like coffee, but I like tea more"], ["Ek is moeg, want ek het swaar gewerk", "I am tired because I worked hard"], ["Ek bly tuis omdat dit reën", "I am staying home because it is raining"], ["Ek wil ook gaan", "I also want to go"]], "unit": "Grammar toolkit"},
 {"id": "comparisons", "level": "intermediate", "title": "Bigger and best", "emoji": "📈", "tips": ["To compare, usually add -er: groot becomes groter and vinnig becomes vinniger.", "For the superlative add -ste: die grootste, die vinnigste.", "Use as for than: Hy is groter as ek. Beter and beste (better and best) are irregular."], "items": [["groter", "bigger"], ["kleiner", "smaller"], ["vinniger", "faster"], ["sterker", "stronger"], ["mooier", "prettier"], ["beter", "better"], ["die beste", "the best"], ["die grootste", "the biggest"], ["Hy is groter as ek", "He is bigger than me"], ["Sy is ouer as haar broer", "She is older than her brother"], ["Dit is goedkoper", "It is cheaper"], ["Dis die beste koffie", "It is the best coffee"], ["Hierdie is die grootste", "This is the biggest"]], "unit": "Grammar toolkit"},
 {"id": "whose", "level": "intermediate", "title": "Whose is it?", "emoji": "🔑", "tips": ["Myne means mine and joune means yours.", "Possessives stay the same before any noun: my boek, hulle motor.", "Wie se...? means Whose...? as in Wie se sak is dit?"], "items": [["myne", "mine"], ["joune", "yours"], ["sleutel", "key"], ["sak", "bag"], ["Dit is my boek", "This is my book"], ["Waar is jou sleutel?", "Where is your key?"], ["Dis haar foon", "It is her phone"], ["Ons huis is groot", "Our house is big"], ["Hulle motor is nuut", "Their car is new"], ["Wie se sak is dit?", "Whose bag is it?"], ["Die boek is myne", "The book is mine"], ["Is dit joune?", "Is it yours?"]], "unit": "Grammar toolkit"},
 {"id": "imperatives", "level": "intermediate", "title": "Giving commands", "emoji": "☝️", "tips": ["Commands use the plain verb: Kom! Gaan! Kyk!", "To say don't, use moenie ... nie: Moenie hardloop nie.", "Adding asseblief makes any command polite: Wag asseblief."], "items": [["Kom!", "Come!"], ["Gaan!", "Go!"], ["Wag!", "Wait!"], ["Kyk!", "Look!"], ["Luister!", "Listen!"], ["Sit", "Sit"], ["Maak die deur oop", "Open the door"], ["Wees stil!", "Be quiet!"], ["Help my!", "Help me!"], ["Moenie hardloop nie", "Don't run"], ["Moenie bekommerd wees nie", "Don't worry"], ["Wag asseblief", "Please wait"]], "unit": "Grammar toolkit"},
 {"id": "wordorder", "level": "intermediate", "title": "Verb to the end", "emoji": "🔚", "tips": ["After words like dat (that), omdat (because) and as (if), the verb moves to the end of the clause.", "In Ek weet dat hy kom, the verb kom goes last.", "When a sentence starts with something other than the subject, the verb comes before the subject: Gister het ek gewerk."], "items": [["dat", "that"], ["toe", "when (in the past)"], ["Ek weet dat hy kom", "I know that he is coming"], ["Hy sê dat hy moeg is", "He says that he is tired"], ["Ek dink dat dit goed is", "I think that it is good"], ["As dit reën, bly ek tuis", "If it rains, I stay home"], ["Ek wil weet waar jy woon", "I want to know where you live"], ["Toe ek jonk was, het ek baie gespeel", "When I was young, I played a lot"], ["Gister het ek gewerk", "Yesterday I worked"], ["Môre gaan ons strand toe", "Tomorrow we are going to the beach"]], "unit": "Grammar toolkit"},
 {"id": "routine", "level": "intermediate", "title": "My daily routine", "emoji": "⏰", "tips": ["Some verbs split in two: opstaan (to get up) becomes Ek staan om sewe uur op.", "The little word moves to the end of the sentence. Terugkom becomes Ek kom terug.", "Ontbyt, middagete and aandete are breakfast, lunch and dinner."], "items": [["ontbyt", "breakfast"], ["middagete", "lunch"], ["aandete", "dinner"], ["Ek staan om sewe uur op", "I get up at seven o'clock"], ["Ek eet ontbyt", "I eat breakfast"], ["Ek gaan werk toe", "I go to work"], ["Ek kom om vyf uur terug", "I come back at five o'clock"], ["Ek kyk televisie", "I watch television"], ["Ek lees voor slaaptyd", "I read before bedtime"], ["Ek gaan bed toe", "I go to bed"]], "unit": "Daily life"},
 {"id": "timeexp", "level": "intermediate", "title": "Time expressions", "emoji": "⌛", "tips": ["Oor can mean in for future time: oor twee dae is in two days.", "Verlede means last and volgende means next.", "After a time word at the start, the verb comes next: Verlede jaar het ek..."], "items": [["binnekort", "soon"], ["eendag", "one day"], ["later", "later"], ["voor", "before"], ["na", "after"], ["volgende week", "next week"], ["volgende maand", "next month"], ["verlede jaar", "last year"], ["oor twee dae", "in two days"], ["Ek sal jou volgende week sien", "I will see you next week"], ["Binnekort gaan ek Kaapstad toe", "Soon I am going to Cape Town"], ["Verlede jaar het ek Durban toe gegaan", "Last year I went to Durban"], ["Ek bel jou oor 'n uur", "I will call you in an hour"]], "unit": "Daily life"},
 {"id": "health", "level": "intermediate", "title": "Health", "emoji": "🩺", "tips": ["Voel nie lekker nie is the everyday way to say you don't feel well.", "Ek het ... nodig means I need ...", "Pyn is pain, and hoofpyn is head-pain, a headache."], "items": [["dokter", "doctor"], ["hospitaal", "hospital"], ["apteek", "pharmacy"], ["medisyne", "medicine"], ["koors", "fever"], ["hoes", "cough"], ["pyn", "pain"], ["hoofpyn", "headache"], ["Ek voel nie lekker nie", "I don't feel well"], ["Ek het 'n dokter nodig", "I need a doctor"], ["Ek het koors", "I have a fever"], ["Waar maak dit seer?", "Where does it hurt?"], ["Dit maak seer", "It hurts"]], "unit": "Daily life"},
 {"id": "banking", "level": "intermediate", "title": "Banking", "emoji": "💳", "tips": ["Maak ... oop is a split verb: Die bank maak om nege oop.", "Spaar means to save money, and betaal means to pay.", "Belasting is tax and salaris is salary. Both are easy to remember."], "items": [["bankrekening", "bank account"], ["salaris", "salary"], ["spaar", "save"], ["leen", "borrow"], ["belasting", "tax"], ["Ek spaar geld", "I am saving money"], ["Ek het 'n bankrekening", "I have a bank account"], ["Die bank maak om nege uur oop", "The bank opens at nine o'clock"], ["Kan ek geld leen?", "Can I borrow money?"], ["My salaris is in die bank", "My salary is in the bank"], ["Die prys het gestyg", "The price has risen"], ["Ek moet belasting betaal", "I must pay tax"]], "unit": "Daily life"},
 {"id": "cooking", "level": "intermediate", "title": "Cooking and recipes", "emoji": "🥣", "tips": ["Recipes use commands: meng, bak, roer.", "Voeg ... by (add) is a split verb: Voeg sout by.", "Meel is flour. Mielies are corn (maize), the base of the famous pap."], "items": [["resep", "recipe"], ["meng", "mix"], ["bak", "bake"], ["roer", "stir"], ["sout", "salt"], ["peper", "pepper"], ["suiker", "sugar"], ["meel", "flour"], ["Meng die meel en suiker", "Mix the flour and sugar"], ["Voeg sout by", "Add salt"], ["Bak dit vir 'n uur", "Bake it for an hour"], ["Roer goed", "Stir well"], ["Die oond is warm", "The oven is hot"]], "unit": "Daily life"},
 {"id": "opinions", "level": "intermediate", "title": "Giving your opinion", "emoji": "💬", "tips": ["Dink means think. Ek dink so means I think so.", "Dis 'n goeie idee is a great phrase for agreeing to plans.", "Dit hang af (it depends) is a handy way to avoid committing."], "items": [["miskien", "maybe"], ["natuurlik", "of course"], ["seker", "sure / surely"], ["dalk", "perhaps"], ["Wat dink jy?", "What do you think?"], ["Ek dink so", "I think so"], ["Ek stem saam", "I agree"], ["Ek stem nie saam nie", "I disagree"], ["Dit hang af", "It depends"], ["Ek is nie seker nie", "I am not sure"], ["Dis 'n goeie idee", "That's a good idea"]], "unit": "Daily life"},
 {"id": "travel", "level": "intermediate", "title": "Holidays and travel", "emoji": "🏖️", "tips": ["Met vakansie gaan means to go on holiday.", "Kaapstad is Cape Town: Kaap (cape) + stad (city).", "Pragtig means gorgeous or beautiful, stronger than mooi."], "items": [["vakansie", "holiday"], ["strand", "beach"], ["berg", "mountain"], ["see", "sea"], ["hotel", "hotel"], ["kaart", "map / card"], ["koffer", "suitcase"], ["paspoort", "passport"], ["Ons gaan met vakansie", "We are going on holiday"], ["Ek het 'n kamer bespreek", "I booked a room"], ["Kaapstad is pragtig", "Cape Town is beautiful"], ["Die see is koud", "The sea is cold"]], "unit": "Travel and roads"},
 {"id": "hotel", "level": "intermediate", "title": "Hotel and booking", "emoji": "🏨", "tips": ["Kry means get: Kan ek 'n handdoek kry?", "Beskikbaar means available.", "Wifi is wifi, so the wifi-wagwoord needs no translation, just the wagwoord (password)."], "items": [["bespreking", "booking"], ["beskikbaar", "available"], ["wagwoord", "password"], ["handdoek", "towel"], ["uitteken", "check out"], ["Ek het 'n bespreking", "I have a booking"], ["Is daar 'n kamer beskikbaar?", "Is there a room available?"], ["Wat is die wifi-wagwoord?", "What is the wifi password?"], ["Hoe laat is ontbyt?", "What time is breakfast?"], ["Kan ek asseblief 'n handdoek kry?", "Can I please get a towel?"], ["Wanneer moet ek uitteken?", "When must I check out?"]], "unit": "Travel and roads"},
 {"id": "road", "level": "intermediate", "title": "On the road", "emoji": "🚦", "tips": ["In South Africa a traffic light is called a robot. Say draai links by die robot when giving directions.", "Bestuur means drive a vehicle, while ry is to ride or travel in one.", "Pap means soft, limp or flat."], "items": [["robot", "traffic light"], ["verkeer", "traffic"], ["snelweg", "highway"], ["spoed", "speed"], ["band", "tyre"], ["pap", "flat / soft"], ["vulstasie", "petrol station"], ["bestuur", "drive"], ["Draai links by die robot", "Turn left at the traffic light"], ["Ek bestuur 'n motor", "I drive a car"], ["Die band is pap", "The tyre is flat"], ["Waar is die naaste vulstasie?", "Where is the nearest petrol station?"], ["Daar is baie verkeer", "There is a lot of traffic"]], "unit": "Travel and roads"},
 {"id": "local", "level": "intermediate", "title": "Local flavour", "emoji": "🔥", "tips": ["These are words you will hear in everyday South African life.", "Ja-nee is a classic: it can mean yes, no, or just I hear you.", "Nou-nou means soon, in a little while, not right now."], "items": [["braai", "barbecue"], ["boerewors", "farmer's sausage"], ["lekker", "nice / great"], ["Eina!", "Ouch!"], ["Ag nee!", "Oh no!"], ["sommer", "just / simply"], ["Nou-nou", "In a little while"], ["Ja-nee", "Yeah, well..."], ["Lekker slaap", "Sleep well"], ["Gesondheid!", "Cheers! / Bless you!"]], "unit": "South African life"},
 {"id": "story3", "level": "intermediate", "title": "Reading: The road trip", "emoji": "🚗", "tips": ["This story is in the present tense until the last line, which uses the past: Ons het veilig aangekom.", "Weg means away: ry weg is drive off.", "Veilig means safe or safely."], "items": [["Ons ry vroeg in die oggend weg", "We drive off early in the morning"], ["Die son kom op", "The sun is rising"], ["Pa bestuur en Ma lees die kaart", "Dad drives and Mom reads the map"], ["Ons stop by 'n vulstasie", "We stop at a petrol station"], ["Die kinders is honger", "The children are hungry"], ["Ons eet toebroodjies in die motor", "We eat sandwiches in the car"], ["Na vier ure sien ons die see", "After four hours we see the sea"], ["Almal is baie opgewonde", "Everyone is very excited"], ["Ons het veilig aangekom", "We arrived safely"]], "unit": "South African life"},
 {"id": "idioms", "level": "advanced", "title": "Idioms", "emoji": "🗣️", "tips": ["Idioms rarely translate word for word, so learn each one as a whole phrase.", "Dit reën pypsteel literally says it rains pipe-stems, meaning very heavy rain.", "Twee vlieë is two flies. English has birds, Afrikaans has flies."], "items": [["Dit reën pypsteel", "It's pouring rain"], ["Dit is Grieks vir my", "It's Greek to me"], ["Hy het die spyker op die kop getref", "He hit the nail on the head"], ["Moenie 'n storm in 'n glas water maak nie", "Don't make a storm in a teacup"], ["Die kat uit die boom kyk", "To wait and see"], ["'n Druppel in die emmer", "A drop in the bucket"], ["Twee vlieë met een klap", "Two birds with one stone"], ["Liefde is blind", "Love is blind"], ["Oefening maak meester", "Practice makes perfect"], ["Beter laat as nooit", "Better late than never"]], "unit": "Natural expression"},
 {"id": "proverbs", "level": "advanced", "title": "Proverbs", "emoji": "📜", "tips": ["'n Boer maak 'n plan is one of the best-known Afrikaans sayings. Where there is a will, a farmer finds a way.", "Eendrag maak mag (unity is strength) has been used as a South African motto.", "Many proverbs are close to their English versions, so they are easy to guess."], "items": [["Die appel val nie ver van die boom nie", "The apple doesn't fall far from the tree"], ["Wie nie waag nie, sal nie wen nie", "Nothing ventured, nothing gained"], ["Een swaeltjie maak nie 'n somer nie", "One swallow doesn't make a summer"], ["'n Boer maak 'n plan", "A farmer finds a way"], ["Die einde kroon die werk", "The end crowns the work"], ["Baie hande maak ligte werk", "Many hands make light work"], ["Wie laaste lag, lag die lekkerste", "He who laughs last laughs best"], ["Eerste kom, eerste maal", "First come, first served"], ["Geduld is 'n deug", "Patience is a virtue"], ["Eendrag maak mag", "Unity is strength"]], "unit": "Natural expression"},
 {"id": "diminutives", "level": "advanced", "title": "Small and sweet", "emoji": "🐣", "tips": ["Add -tjie, -ie, -kie or -pie to make something small, sweet or friendly.", "Which ending depends on the last sound: hond becomes hondjie and huis becomes huisie.", "Diminutives are everywhere in everyday speech: Ek wil 'n koppie tee hê."], "items": [["huisie", "little house"], ["katjie", "kitten"], ["hondjie", "puppy"], ["boekie", "little book"], ["tafeltjie", "little table"], ["blommetjie", "little flower"], ["oulik", "cute"], ["Die hondjie is baie oulik", "The puppy is very cute"], ["Ek wil 'n koppie tee hê", "I would like a cup of tea"], ["Wag 'n bietjie", "Wait a moment"], ["Sy het 'n klein huisie", "She has a little house"]], "unit": "Natural expression"},
 {"id": "passive", "level": "advanced", "title": "The passive voice", "emoji": "🔄", "tips": ["Use word for something happening now: Die brood word gebak (is being baked).", "Use is plus ge- verb for something completed: Die deur is gesluit.", "Deur means by the person doing the action: deur 'n skrywer (by an author)."], "items": [["skrywer", "author / writer"], ["gebou", "built"], ["Die brood word gebak", "The bread is being baked"], ["Die brief is geskryf", "The letter has been written"], ["Afrikaans word in Suid-Afrika gepraat", "Afrikaans is spoken in South Africa"], ["Die deur is gesluit", "The door has been closed"], ["Die kos word gekook", "The food is being cooked"], ["Dit is gedoen", "It has been done"], ["Die boek is deur 'n skrywer geskryf", "The book was written by an author"], ["Die huis is in 1990 gebou", "The house was built in 1990"]], "unit": "Grammar in depth"},
 {"id": "complex", "level": "advanced", "title": "Complex sentences", "emoji": "🧠", "tips": ["These conjunctions send the verb to the end of their clause: terwyl ek werk.", "When the although, while or before clause comes first, the next clause begins with its verb: Terwyl ek werk, luister ek.", "Nadat ... het is the pattern for after something happened."], "items": [["alhoewel", "although"], ["sodat", "so that"], ["terwyl", "while"], ["voordat", "before"], ["nadat", "after"], ["Alhoewel dit reën, gaan ons uit", "Although it is raining, we are going out"], ["Ek leer Afrikaans sodat ek met almal kan praat", "I am learning Afrikaans so that I can speak with everyone"], ["Terwyl ek werk, luister ek na musiek", "While I work, I listen to music"], ["Voordat ek slaap, lees ek", "Before I sleep, I read"], ["Nadat ons geëet het, het ons gestap", "After we ate, we walked"]], "unit": "Grammar in depth"},
 {"id": "formal", "level": "advanced", "title": "Formal Afrikaans", "emoji": "🎩", "tips": ["U is the formal you, used with elders, officials or strangers in formal settings.", "Many Afrikaans speakers still say oom and tannie instead of u in friendly situations.", "Mag ek...? means May I...? and sounds respectful."], "items": [["u", "you (formal)"], ["meneer", "sir / Mr"], ["mevrou", "madam / Mrs"], ["juffrou", "miss"], ["Hoe gaan dit met u?", "How are you? (formal)"], ["Kan ek u help?", "Can I help you?"], ["Met vriendelike groete", "Kind regards"], ["Geagte Meneer", "Dear Sir"], ["Ek wil graag 'n afspraak maak", "I would like to make an appointment"], ["Mag ek asseblief 'n glas water kry?", "May I please have a glass of water?"], ["Ek waardeer dit", "I appreciate it"]], "unit": "Grammar in depth"},
 {"id": "workplace", "level": "advanced", "title": "At work", "emoji": "🧑‍💼", "tips": ["Many work words look familiar: projek, kollega, kliënt.", "By can mean at: by 'n maatskappy is at a company.", "Sperdatum is sper (barrier) plus datum (date), the Afrikaans word for deadline."], "items": [["kollega", "colleague"], ["projek", "project"], ["sperdatum", "deadline"], ["verslag", "report"], ["kliënt", "client"], ["onderhoud", "interview"], ["maatskappy", "company"], ["Ek werk by 'n maatskappy", "I work at a company"], ["Die vergadering begin om tien", "The meeting starts at ten"], ["Ek moet 'n verslag skryf", "I must write a report"], ["Ons het 'n sperdatum", "We have a deadline"], ["Die kliënt is tevrede", "The client is satisfied"]], "unit": "Work and technology"},
 {"id": "tech", "level": "advanced", "title": "Technology", "emoji": "💻", "tips": ["Laai af is a split verb: Laai die toep af.", "Aan and af mean on and off: skakel aan, skakel af.", "Many tech words come straight from English, so internet and wifi are easy."], "items": [["internet", "internet"], ["wifi", "wifi"], ["skerm", "screen"], ["sleutelbord", "keyboard"], ["toep", "app"], ["aflaai", "download"], ["Die internet is stadig", "The internet is slow"], ["My selfoon is dood", "My phone is dead"], ["Laai die toep af", "Download the app"], ["Skakel die rekenaar aan", "Turn the computer on"], ["Skakel dit af", "Turn it off"]], "unit": "Work and technology"},
 {"id": "culture", "level": "advanced", "title": "South African culture", "emoji": "🇿🇦", "tips": ["Place names often join words: Tafel (table) plus berg (mountain), wild plus tuin (garden).", "Mens means one or a person: Hoe sê mens dit? is How does one say it?", "Afrikaans developed in South Africa and is spoken by millions, as a first or second language."], "items": [["Suid-Afrika", "South Africa"], ["Kaapstad", "Cape Town"], ["Tafelberg", "Table Mountain"], ["Krugerwildtuin", "Kruger National Park"], ["springbok", "springbok"], ["protea", "protea"], ["Suid-Afrika het elf amptelike tale", "South Africa has eleven official languages"], ["Afrikaans is een van die tale", "Afrikaans is one of the languages"], ["Hoe sê mens dit in Afrikaans?", "How do you say it in Afrikaans?"], ["Welkom in Suid-Afrika", "Welcome to South Africa"], ["Ek wil die Tafelberg sien", "I want to see Table Mountain"]], "unit": "Culture and ideas"},
 {"id": "views", "level": "advanced", "title": "Giving your view", "emoji": "🧭", "tips": ["Aan die een kant ... aan die ander kant is the classic structure for balanced opinions.", "Eens is the key word in dit eens wees, to agree.", "Mening means opinion."], "items": [["Ek is dit eens", "I agree"], ["Ek verskil van jou", "I differ from you"], ["Na my mening", "In my opinion"], ["Dit maak sin", "That makes sense"], ["Ek twyfel daaraan", "I doubt it"], ["Dis jammer", "It's a pity"], ["Dit hang van jou af", "It depends on you"], ["Dis nie so eenvoudig nie", "It's not that simple"], ["Ek stem nie heeltemal saam nie", "I don't completely agree"], ["Aan die een kant", "On the one hand"], ["Aan die ander kant", "On the other hand"]], "unit": "Culture and ideas"}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const slug=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i]}for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
const sim=(a,b)=>{a=norm(a);b=norm(b);const L=Math.max(a.length,b.length)||1;return 1-lev(a,b)/L};

/* ---------- GitHub gist sync ---------- */
const FILE='afrikaans-progress.json';
function payload(){const c=JSON.parse(JSON.stringify(S));delete c.gh;return JSON.stringify(c,null,1)}
async function gh(path,opt){const r=await fetch('https://api.github.com'+path,Object.assign({headers:{'Authorization':'Bearer '+S.gh.token,'Accept':'application/vnd.github+json'}},opt));if(!r.ok)throw new Error('GitHub said '+r.status);return r.json()}
async function push(){
  if(!S.gh.token)return 'Add a GitHub token first.';
  try{
    const files={};files[FILE]={content:payload()};
    if(S.gh.gist){await gh('/gists/'+S.gh.gist,{method:'PATCH',body:JSON.stringify({files})})}
    else{const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Leer Afrikaans progress',public:false,files})});S.gh.gist=g.id;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    return 'Saved to GitHub.';
  }catch(e){return 'Could not save: '+e.message}
}
async function pull(){
  if(!S.gh.token||!S.gh.gist)return 'Add your token and gist ID first.';
  try{
    const g=await gh('/gists/'+S.gh.gist);const f=g.files[FILE];if(!f)return 'No progress file found in that gist.';
    const remote=JSON.parse(f.content);const keep=S.gh;S=Object.assign(blank(),remote);S.gh=keep;save();return 'Loaded your progress from GitHub.';
  }catch(e){return 'Could not load: '+e.message}
}
function schedulePush(){if(!S.gh.token)return;clearTimeout(pushTimer);pushTimer=setTimeout(()=>{push()},1500)}

let curAudio=null;
function afVoice(){if(!('speechSynthesis' in window))return null;const vs=speechSynthesis.getVoices();return vs.find(v=>/^af/i.test(v.lang))||null}
function nlVoice(){if(!('speechSynthesis' in window))return null;return speechSynthesis.getVoices().find(v=>/^nl/i.test(v.lang))||null}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{if(V.name==='settings')render()}}
function speak(text,slow){
  const s=slug(text);
  try{if(curAudio){curAudio.pause();curAudio=null}}catch(e){}
  if(HAS.has(s)){const a=new Audio('audio/'+s+'.mp3');a.playbackRate=slow?.7:1;curAudio=a;a.play().catch(()=>{});return}
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const v=afVoice()||nlVoice();
  if(v){u.voice=v;u.lang=v.lang}else u.lang='af-ZA';
  u.rate=slow?.55:S.rate;
  speechSynthesis.speak(u);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listenOnce(cb){
  if(!SR)return cb(null,'unsupported');
  let done=false;const fin=(a,e)=>{if(!done){done=true;cb(a,e)}};
  try{
    const r=new SR();r.lang='af-ZA';r.interimResults=false;r.maxAlternatives=3;
    r.onresult=e=>fin([...e.results[0]].map(x=>x.transcript));
    r.onerror=e=>fin(null,e.error);
    r.onend=()=>fin(null,'no-speech');
    r.start();
  }catch(e){fin(null,'unsupported')}
}

function distract(correct,idx,pool){
  const out=[];const seenv=new Set([correct]);
  for(const it of shuffle(pool).concat(shuffle(ALL))){const v=it[idx];if(!seenv.has(v)){seenv.add(v);out.push(v)}if(out.length===3)break}
  return out;
}

function picD(item,wantEmoji){
  const e=pic(item);const seen=new Set([wantEmoji?e:item[0]]);const out=[];
  const inS=x=>Q&&Q.session.items.indexOf(x)>=0?1:0;
  const cand=shuffle(PICS.filter(it=>pic(it)!==e&&it[0]!==item[0])).sort((x,y)=>inS(y)-inS(x));
  for(const it of cand){const v=wantEmoji?pic(it):it[0];if(!seen.has(v)){seen.add(v);out.push(v)}if(out.length===3)break}
  return out;
}
function extraToks(item){
  const have=new Set(toks(item).map(w=>w.toLowerCase()));const out=[];
  for(const w of shuffle(Q.session.items.concat(ALL)).flatMap(it=>it[0].split(' '))){
    const c=w.toLowerCase();
    if(/^\p{L}{2,}$/u.test(w)&&!have.has(c)&&!out.includes(c)){out.push(c);if(out.length===2)break}
  }
  return out;
}
function blankD(word){
  const cap=/^\p{Lu}/u.test(word);const seen=new Set([word.toLowerCase()]);const out=[];
  for(const raw of shuffle(Q.session.items.concat(ALL)).flatMap(it=>it[0].split(' '))){
    const w=raw.replace(/[^\p{L}]/gu,'');const c=w.toLowerCase();
    if(w.length>=3&&!seen.has(c)){seen.add(c);out.push(cap?c[0].toUpperCase()+c.slice(1):c)}
    if(out.length===3)break;
  }
  return out;
}
const tileHtml=(t,act,cls,dis)=>`<button class="tile ${cls||''}" data-act="${act}" data-id="${t.id}" ${dis?'disabled':''}>${esc(t.t)}</button>`;
function optsHtml(q,fb,emo){
  return `<div class="${emo?'picopts':'opts'}">${q.opts.map((o,i)=>`<button class="opt ${fb?(o===q.ans?'good':i===q.picked?'bad':''):''}" data-act="opt" data-i="${i}" ${fb?'disabled':''}>${esc(o)}</button>`).join('')}</div>`;
}
function tilesHtml(q,fb,label,promptHtml,checkLabel){
  const placed=q.placed.map(id=>q.bank.find(b=>b.id===id));
  return `<p class="label">${label}</p>${promptHtml}
   <div class="slots">${placed.map(t=>tileHtml(t,'untile',fb?(fb.ok?'ok':'no'):'',!!fb)).join('')}</div>
   <div class="bank">${q.bank.map(t=>tileHtml(t,'tile',q.placed.includes(t.id)?'used':'',!!fb||q.placed.includes(t.id))).join('')}</div>
   ${fb?'':`<button class="primary" data-act="checkt" ${q.placed.length?'':'disabled style="opacity:.45"'}>${checkLabel||'Check'}</button>`}`;
}

    if(!q.mm){
      const cards=[];
      q.items.forEach((it,i)=>{cards.push({pair:i,k:'a',txt:it[0]});cards.push({pair:i,k:'b',txt:pic(it)||it[1],emo:!!pic(it)})});
      q.mm={cards:shuffle(cards),open:[],done:[],moves:0,lock:false};
    }
    const m=q.mm;
    h+=`<p class="label">Memory match · find each word and its meaning (moves: ${m.moves})</p><div class="mem ${m.cards.length>12?'four':''}">${m.cards.map((c,i)=>{
      const up=m.open.includes(i),dn=m.done.includes(i);
      return `<button class="mcard ${dn?'done':up?'up':''}" data-act="mem" data-i="${i}" ${dn||fb?'disabled':''} aria-label="Card">${(up||dn)?(c.emo?`<span class="e">${c.txt}</span>`:esc(c.txt)):'?'}</button>`}).join('')}</div>`;
  }else if(q.t==='speak'){
    const sp=q.sp||{s:'idle'};
    h+=`<p class="label">Say it out loud</p><div class="prompt">${esc(af)}</div><div class="row" style="margin:-10px 0 14px">${spk(af)}${spk(af,true)}<span class="muted">${esc(en)}</span></div>`;
    if(fb){}
    else if(sp.s==='unsup'||!SR){
      h+=`<div class="note">${sp.s==='unsup'?'Speech recognition isn\'t available for Afrikaans on this device or browser.':'This browser can\'t listen to Afrikaans.'} Play the word, say it aloud, and rate yourself.</div><button class="primary" data-act="selfok">I said it</button><button class="ghost" style="width:100%" data-act="skip">Skip</button>`;
    }else{
      h+=`<button class="micbtn ${sp.s==='listening'?'live':''}" data-act="mic" aria-label="Start listening">🎤</button><p style="text-align:center" class="muted">${sp.s==='listening'?'Listening…':sp.s==='miss'?'I heard “'+esc(sp.heard)+'”. Give it another go.':sp.s==='quiet'?'I didn\'t hear anything. Tap and try again.':'Tap the mic and say it'}</p>${sp.s==='miss'||sp.s==='quiet'?'<button class="ghost" style="width:100%" data-act="skip">Move on</button>':''}`;
    }
  }
  if(fb){
    h+=`<div class="fbspace"></div><div class="fb ${fb.ok?'good':'bad'}"><div><strong>${fb.ok?fb.praise:'Not quite'}</strong><p>${fb.note||''}</p><button class="primary" data-act="next">Continue</button></div></div>`;
  }
  return h;
}

/* ---------- daily challenge ---------- */
function dailyDone(){return !!(S.daily&&S.daily.date===today()&&S.daily.done)}
function dailyItems(){
  if(!S.daily||S.daily.date!==today()){
    const lrn=learned().map(k=>BYAF[k]);
    let picked;
    if(lrn.length>=6){
      const weak=lrn.slice().sort((a,b)=>S.words[a[0]].s-S.words[b[0]].s).slice(0,12);
      picked=sample(weak,6);
      picked=picked.concat(sample(lrn.filter(x=>!picked.includes(x)),4));
    }else picked=sample(ALL,10);
    S.daily={date:today(),keys:picked.map(x=>x[0]),done:false,pct:0};
    save();
  }
  return S.daily.keys.map(k=>BYAF[k]).filter(Boolean);
}

/* ---------- quiz engine ---------- */
function make(type,it,i){
  switch(type){
    case 'mc':return {t:'mc',item:it,dir:i%2?'en2af':'af2en'};
    case 'listen':return {t:'listen',item:it};
    case 'type':return {t:'type',item:it};
    case 'dictate':return {t:'dictate',item:it};
    case 'pic':return pic(it)?{t:'pic',item:it,dir:i%2?'a2e':'e2a'}:null;
    case 'spell':return isSpell(it)?{t:'spell',item:it}:null;
    case 'build':return isPhrase(it)?{t:'build',item:it}:null;
    case 'blank':return isPhrase(it)?{t:'blank',item:it}:null;
  }
  return null;
}
const memoryQ=(items,n)=>({t:'memory',items:sample(items,Math.min(n||6,items.length))});
function build(session){
  const items=shuffle(session.items);const out=[];
  if(session.kind==='lesson'){
    items.forEach((it,i)=>{
      let q=null;
      if(pic(it)&&i%2===0)q=make('pic',it,i);
      else if(isPhrase(it)&&i%2===1)q=make('build',it,i);
      out.push(q||make('mc',it,i));
    });
    const take=(type,n,f)=>shuffle(items.filter(f)).slice(0,n).forEach((it,i)=>out.push(make(type,it,i)));
    take('listen',2,()=>true);take('spell',2,isSpell);take('dictate',1,()=>true);take('type',2,()=>true);take('blank',1,isPhrase);
    if(items.length>=5)out.push({t:'match',items:sample(items,5)});
    if(items.length>=6)out.push(memoryQ(items,6));
    const ph=items.filter(i=>i[0].includes(' '));
    sample(ph.length>=2?ph:items,2).forEach(it=>out.push({t:'speak',item:it}));
  }else if(session.kind==='game'){
    const g=session.game;
    if(g==='memory'){out.push(memoryQ(items,6));const rest=items.slice(6);out.push(memoryQ(rest.length>=6?rest:items,6))}
    else{const n=g==='pic'?10:8;items.slice(0,n).forEach((it,i)=>out.push(make(g,it,i)))}
  }else{
    const n=Math.min(items.length,session.kind==='test'?12:10);
    const cyc=['mc','listen','pic','type','spell','build','dictate','blank'];
    items.slice(0,n).forEach((it,i)=>{let q=null;for(let k=0;k<cyc.length&&!q;k++)q=make(cyc[(i+k)%cyc.length],it,i);out.push(q)});
    if(items.length>=5)out.push({t:'match',items:sample(items,5)});
  }
  return out;
}
function startSession(session){
  const queue=build(session);
  Q={session,queue,i:0,right:0,total:queue.length,weak:new Set(),fb:null,done:null};
  V={name:'quiz'};render();
}
function bump(q,ok){
  (q.items||[q.item]).forEach(it=>{const w=word(it[0]);w.s=Math.max(0,Math.min(5,w.s+(ok?1:-1)))});
}
const PRAISE=['Reg!','Mooi so!','Presies!','Goed gedoen!','Lekker!'];
const SPOKEN=['listen','type','speak','build','spell','dictate','blank'];
function answer(ok,note){
  const q=Q.queue[Q.i];
  if(!q.retry){
    if(ok)Q.right++;
    bump(q,ok);
    if(!ok&&q.t!=='speak'&&q.t!=='memory'){
      if(q.item)Q.weak.add(q.item[0]);
      Q.queue.push(Object.assign({},q,{retry:true,opts:null,picked:null,m:null,sp:null,val:'',played:false,bank:null,placed:null,mm:null,bi:undefined,word:undefined}));
    }
  }
  Q.fb={ok,note:note||'',praise:pick(PRAISE)};
  if(q.item&&(!ok||SPOKEN.includes(q.t)))speak(q.item[0]);
  save();render();
}
function advance(){
  Q.fb=null;Q.i++;
  if(Q.i>=Q.queue.length)finish();else render();
}
function touchStreak(){
  if(S.lastDay!==today()){S.streak=S.lastDay===yesterday()?S.streak+1:1;S.lastDay=today()}
  S.best=Math.max(S.best,S.streak);
}
function finish(){
  const pct=Math.round(Q.right/Math.max(1,Q.total)*100);
  const xp=Q.right*10+(pct>=60?20:0);
  S.xp+=xp;touchStreak();
  const s=Q.session;let was=false;
  if(s.kind==='lesson'){const r=S.lessons[s.id]||{best:0,attempts:0};was=r.best>=60;r.best=Math.max(r.best,pct);r.attempts++;S.lessons[s.id]=r}
  if(s.kind==='test'){const r=S.tests[s.id]||{best:0};r.best=Math.max(r.best,pct);S.tests[s.id]=r}
  let bonus=0;
  if(s.kind==='daily'&&S.daily&&S.daily.date===today()&&!S.daily.done&&pct>=50){bonus=50;S.xp+=bonus;S.daily.done=true;S.daily.pct=pct;S.dailyCount=(S.dailyCount||0)+1}
  Q.done={pct,xp:xp+bonus,was,bonus};
  save();schedulePush();
  V={name:'done'};render();
}

/* ---------- actions ---------- */
const ACT={
  say:t=>speak(t.dataset.say,t.dataset.slow==='1'),
  remind:()=>{
    const t=(S.remindTime||'19:00').split(':'),pad=n=>String(n).padStart(2,'0');
    const d=new Date(),ymd=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
    const end=pad((+t[0]*60+ +t[1]+15)%1440/60|0)+pad((+t[0]*60+ +t[1]+15)%60);
    const url=location.href.split('#')[0];
    const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Leer Afrikaans//EN','BEGIN:VEVENT','UID:leer-afrikaans-daily@'+location.host,'DTSTAMP:'+stamp,
      'DTSTART:'+ymd+'T'+pad(+t[0])+pad(+t[1])+'00','DTEND:'+ymd+'T'+end+'00','RRULE:FREQ=DAILY','SUMMARY:Leer Afrikaans: daily challenge',
      'DESCRIPTION:A few minutes of Afrikaans keeps your streak alive. '+url,'URL:'+url,
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Time for your Afrikaans!','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='leer-afrikaans-reminder.ics';document.body.appendChild(a);a.click();a.remove();V.msg='Open the downloaded file and tap Add All to save the reminder to Calendar.'}
    catch(e){V.msg='Could not create the reminder file.'}
    render();
  },
  daily:()=>startSession({kind:'daily',id:'daily',title:'Daily challenge',items:dailyItems()}),
  game:t=>{
    const g=t.dataset.g;
    if(g==='speed')return startSpeed();
    if(g==='daily')return ACT.daily();
    const meta={pic:{f:pic,min:5,title:'Picture challenge'},spell:{f:isSpell,min:5,title:'Spelling bee'},build:{f:isPhrase,min:5,title:'Sentence builder'},memory:{f:()=>true,min:8,title:'Memory match'}}[g];
    let pool=learned().map(k=>BYAF[k]).filter(meta.f);
    if(pool.length<meta.min)pool=ALL.filter(meta.f);
    startSession({kind:'game',game:g,id:g,title:meta.title,items:pool});
  },
  sopt:t=>{
    if(Date.now()>=G.end){endSpeed();return}
    const i=+t.dataset.i,q=G.q,ok=q.opts[i]===q.ans;
    const w=word(q.it[0]);w.s=Math.max(0,Math.min(5,w.s+(ok?1:-1)));
    if(ok){G.score++;G.last='✓'}else G.last='✗ '+q.it[0]+' = '+q.it[1];
    nextSpeedQ();render();
  },
  tile:t=>{const q=Q.queue[Q.i];if(Q.fb)return;const id=+t.dataset.id;if(!q.placed.includes(id))q.placed.push(id);render()},
  untile:t=>{const q=Q.queue[Q.i];if(Q.fb)return;const id=+t.dataset.id;q.placed=q.placed.filter(x=>x!==id);render()},
  checkt:()=>{
    const q=Q.queue[Q.i];if(Q.fb||!q.placed.length)return;
    const parts=q.placed.map(id=>q.bank.find(b=>b.id===id).t);
    const ok=q.t==='build'?norm(parts.join(' '))===norm(q.item[0]):parts.join('').toLowerCase()===q.item[0].toLowerCase();
    answer(ok,ok?'':'Answer: <b>'+esc(q.item[0])+'</b><br><span class="small">We\'ll try this one again.</span>');
  },
  mem:t=>{
    const q=Q.queue[Q.i],m=q.mm;if(Q.fb||m.lock)return;
    const i=+t.dataset.i;if(m.open.includes(i)||m.done.includes(i))return;
    m.open.push(i);const c=m.cards[i];if(c.k==='a')speak(c.txt);
    if(m.open.length<2){render();return}
    m.moves++;
    const [x,y]=m.open.map(k=>m.cards[k]);
    if(x.pair===y.pair){
      m.done.push(...m.open);m.open=[];
      if(m.done.length===m.cards.length){answer(m.moves<=q.items.length*2,'Finished in '+m.moves+' moves.');return}
      render();
    }else{
      m.lock=true;render();
      setTimeout(()=>{m.open=[];m.lock=false;if(Q&&Q.queue[Q.i]===q&&V.name==='quiz')render()},900);
    }
  },
  tab:t=>{V={name:t.dataset.t};render()},
  home:()=>{Q=null;L=null;V={name:'home'};render()},
  setname:()=>{const v=document.getElementById('nm').value.trim();if(!v)return;S.name=v;save();render()},
  open:t=>{const l=LESSONS.find(x=>x.id===t.dataset.id);L={lesson:l,i:-1};V={name:'learn'};render()},
  lback:()=>{if(L.i>0){L.i--;render();speak(L.lesson.items[L.i][0])}},
  lnext:()=>{
    const n=L.lesson.items.length;
    if(L.i>=0&&L.i===n-1){ACT.lquiz();return}
    L.i++;const it=L.lesson.items[L.i];word(it[0]);save();render();speak(it[0]);
  },
  lquiz:()=>{L.lesson.items.forEach(it=>word(it[0]));save();startSession({kind:'lesson',id:L.lesson.id,title:L.lesson.title,items:L.lesson.items})},
  test:t=>{const lv=LEVELS.find(x=>x.id===t.dataset.id);const items=[];LESSONS.filter(l=>l.level===lv.id).forEach(l=>l.items.forEach(i=>items.push(i)));startSession({kind:'test',id:lv.id,title:lv.name+' test',items})},
  review:()=>{
    const ks=learned().sort((a,b)=>S.words[a].s-S.words[b].s||Math.random()-.5).slice(0,12);
    startSession({kind:'review',id:'review',title:'Practice',items:ks.map(k=>BYAF[k])});
  },
  retake:()=>startSession(Q.session),
  opt:t=>{
    if(Q.fb)return;const q=Q.queue[Q.i];const i=+t.dataset.i;q.picked=i;
    const ok=q.opts[i]===q.ans;
    answer(ok,ok?(q.t==='blank'?esc(q.item[0]):''):'Answer: <b>'+esc(q.ans)+'</b>'+(q.item?'<br><span class="small">'+esc(q.item[0])+' = '+esc(q.item[1])+'</span>':'')+'<br><span class="small">We\'ll try this one again.</span>');
  },
  ch:t=>{const i=document.getElementById('ti');if(!i)return;const s=i.selectionStart,e=i.selectionEnd;i.setRangeText(t.dataset.c,s,e,'end');i.focus()},
  check:()=>{
    if(Q.fb)return;const q=Q.queue[Q.i];const i=document.getElementById('ti');q.val=i.value;if(!norm(q.val))return;
    const ok=norm(q.val)===norm(q.item[0]);
    let note='';
    if(ok&&q.val.trim().toLowerCase()!==q.item[0].toLowerCase())note='Spelled with accents it is <b>'+esc(q.item[0])+'</b>.';
    if(!ok)note='Answer: <b>'+esc(q.item[0])+'</b><br><span class="small">We\'ll try this one again.</span>';
    answer(ok,note);
  },
  mt:t=>{
    const q=Q.queue[Q.i],m=q.m;if(Q.fb||m.bad)return;
    const side=t.dataset.side,i=+t.dataset.i;
    if(!m.sel||m.sel.side===side){m.sel={side,i};speak_if_left(q,side,i);render();return}
    const a=m.sel;m.sel=null;
    if(a.i===i){m.done.push(i);speak(q.items[i][0]);
      if(m.done.length===q.items.length){answer(m.err<=1,m.err?m.err+(m.err===1?' slip':' slips')+' along the way.':'No slips. Lovely!');return}
      render();
    }else{m.err++;m.bad=[a,{side,i}];render();setTimeout(()=>{m.bad=null;if(Q&&Q.queue[Q.i]===q)render()},550)}
  },
  mic:()=>{
    const q=Q.queue[Q.i];if(Q.fb||(q.sp&&q.sp.s==='listening'))return;
    q.sp={s:'listening'};render();
    listenOnce((alts,err)=>{
      if(!Q||Q.queue[Q.i]!==q||Q.fb)return;
      if(err){q.sp={s:(err==='no-speech'||err==='aborted')?'quiet':'unsup'};render();return}
      const best=alts.reduce((a,b)=>sim(a,q.item[0])>=sim(b,q.item[0])?a:b);
      if(sim(best,q.item[0])>=.72){answer(true,'I heard “'+esc(best)+'”. Great pronunciation!')}
      else{q.sp={s:'miss',heard:best};render()}
    });
  },
  selfok:()=>answer(true,'Saying it aloud is the best practice there is.'),
  skip:()=>{Q.total--;if(Q.total<1)Q.total=1;advance()},
  next:()=>advance(),
  gpush:async()=>{V.msg='Saving…';render();V.msg=await push();render()},
  gpull:async()=>{V.msg='Loading…';render();V.msg=await pull();render()},
  export:()=>{const b=new Blob([payload()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='afrikaans-progress.json';a.click()},
  reset:()=>{if(confirm('Erase all progress on this device? This cannot be undone.')){const g=S.gh;S=blank();S.gh=g;save();V={name:'home'};render()}}
};
function speak_if_left(q,side,i){if(side==='L')speak(q.items[i][0])}

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f)f(t,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ti')ACT.check()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='imp'&&t.files[0]){
    t.files[0].text().then(x=>{try{const r=JSON.parse(x);const g=S.gh;S=Object.assign(blank(),r);S.gh=g;save();V={name:'home'};render()}catch(err){V.msg='That file could not be read.';render()}});return;
  }
  const b=t.dataset&&t.dataset.bind;if(!b)return;
  let v=t.value;if(b==='rate')v=parseFloat(v);
  if(b.startsWith('gh.'))S.gh[b.slice(3)]=v.trim();else S[b]=v;
  save();
});
render();
})();
</script>
